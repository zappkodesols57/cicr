name: Deploy CICR Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Server Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment..."

            # Ensure /var/www/cicr directory exists
            sudo mkdir -p /var/www/cicr
            sudo chown -R $USER:$USER /var/www/cicr

            cd /var/www/cicr

            # If not a git repo yet, clone the repo automatically
            if [ ! -d ".git" ]; then
                echo "Git repository not found on server. Cloning repository..."
                git clone https://github.com/zappkodesols57/cicr.git .
            else
                echo "Git repository found. Fetching latest changes..."
                git fetch origin main
                git reset --hard origin/main
            fi

            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # One-time repair for servers that already applied django.contrib.admin
            # before the custom login.User model was introduced.
            python cicr/manage.py shell <<'PY'
            from django.db import connection

            with connection.cursor() as cursor:
                cursor.execute(
                    """
                    SELECT COUNT(*)
                    FROM django_migrations
                    WHERE app = 'admin' AND name = '0001_initial'
                    """
                )
                admin_applied = cursor.fetchone()[0] > 0

                cursor.execute(
                    """
                    SELECT COUNT(*)
                    FROM django_migrations
                    WHERE app = 'login' AND name = '0001_initial'
                    """
                )
                login_applied = cursor.fetchone()[0] > 0

                if admin_applied and not login_applied:
                    cursor.execute("DELETE FROM django_migrations WHERE app = 'admin'")
                    print("Removed stale admin migration records; login migrations will run first.")
            PY

            python cicr/manage.py migrate login --noinput
            python cicr/manage.py migrate admin --fake-initial --noinput
            python cicr/manage.py migrate --noinput
            python cicr/manage.py collectstatic --noinput

            if systemctl is-active --quiet gunicorn; then
                sudo systemctl restart gunicorn
            elif systemctl is-active --quiet cicr; then
                sudo systemctl restart cicr
            fi

            echo "PostgreSQL and Django deployment completed successfully!"
