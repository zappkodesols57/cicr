name: Deploy CICR Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Server Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment..."
            cd /var/www/cicr
            git pull origin main

            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            python cicr/manage.py migrate --noinput
            python cicr/manage.py collectstatic --noinput

            if systemctl is-active --quiet gunicorn; then
                sudo systemctl restart gunicorn
            elif systemctl is-active --quiet cicr; then
                sudo systemctl restart cicr
            fi

            echo "PostgreSQL and Django deployment completed successfully!"