{% extends "base.html" %} 
{% block content %}

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Financial Year</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Financial Year List</h2>

    <!-- Add Banner Button -->
    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#YearModal" onclick="openAddModal()">
        Add Financial Year
    </button>

    <!-- Banner Table -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for i in years %}
            <tr>
                <td>{{ i.financial_year }}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="openEditModal({{ i.id }}, '{{ i.financial_year }}')">Edit</button>
                    <a href="{% url 'year_delete' i.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="YearModal" tabindex="-1" aria-labelledby="yearModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form method="POST" enctype="multipart/form-data" class="modal-content">
        {% csrf_token %}
        <input type="hidden" name="financial_year_id" id="yearIdField">
        <div class="modal-header">
            <h5 class="modal-title" id="yearModalLabel">Add/Edit Year</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label for="financial_year" class="form-label">Financial Year</label>
                <input type="text" class="form-control" name="financial_year" id="financial_year" required>
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
    </form>
  </div>
</div>

<script>
function openAddModal() {
    document.getElementById('yearModalLabel').innerText = 'Add Financial Year';
    document.getElementById('yearIdField').value = '';
    document.getElementById('financial_year').required = true;
}

function openEditModal(id, financial_year) {
    document.getElementById('yearModalLabel').innerText = 'Edit Financial Year';
    document.getElementById('yearIdField').value = id;
    document.getElementById('financial_year').value = financial_year;
    const modal = new bootstrap.Modal(document.getElementById('YearModal'));
    modal.show();
}
</script>
</body>
</html>

{% endblock %}
