{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit District</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .add-district-form{
            width: 100%;
            min-height: calc(100vh - 118px);
            display: block;
        }

        .form-container {
            background: #ffffff;
            border: 1px solid #d9eadc;
            border-radius: 8px;
            padding: 28px;
            max-width: none;
            width: 100%;
            min-height: calc(100vh - 142px);
            box-shadow: 0 14px 32px rgba(0, 93, 24, 0.08);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 6px;
            color: #17251d;
            text-align: left;
            font-weight: 800;
        }

        .form-subtitle {
            color: #66766d;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            max-width: 720px;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            color: #17251d;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            height: 52px;
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #d9eadc;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #007f2a;
            box-shadow: 0 0 0 4px rgba(0, 127, 42, 0.08);
            outline: none;
        }

        .form-group p {
            font-size: 14px;
            color: red;
            margin-top: 5px;
        }

        button {
            background-color: #007f2a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.3s ease;
            min-width: 220px;
            width: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #006d24;
        }


        button:focus {
            outline: none;
        }
    </style>
</head>
<body>

        <div class="add-district-form">
            <div class="form-container">
                <h1>Edit District</h1>
                <p class="form-subtitle">Update district information in the super admin system.</p>
                <form method="post">
                    {% csrf_token %}
                      <div class="form-group">
                        <label for="district_name">District Name:</label>
                        <input type="text" id="district_name" name="district_name" value="{{data.district_name}}" required>
                    </div>
                    <button type="submit">Save</button>
                </form>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const districtNameInput = document.getElementById('district_name');
                districtNameInput.addEventListener('input', function() {
                    districtNameInput.value = districtNameInput.value.toUpperCase();
                });
            });
        </script>
</body>
</html>
{% endblock %}
