{% extends "admin_base.html" %}
{% block content %}

<!DOCTYPE html>
<html>
<head>
   
    <title>Create Investigator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
  />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;

        }

        .create-investigator-section{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background-color: #fff;
            border-radius: 8px;
            
            padding: 30px;
            display: flex;
            justify-content: start;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 1rem;
            width: 100%;
            max-width: 800px;
            
        }



        button {
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #218838;
        }

        .modal-input-section{
          
            display: flex;
            justify-content: start;
            align-items: start;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 5px;

        }
        .modal-input-section label {
            font-size: 14px;
          }
    
          .modal-input-section input {
            width: 100%;
            outline: none;
            border: none;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.2s ease-in;
            border: 1px solid rgb(68, 68, 68);
          }
    
          .modal-input-section input:focus {
            outline: none;
            border: 1.5px solid black;
            background-color: white;
          }
          .modal-input-section select {
            width: 100%;
            outline: none;
            border: none;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.2s ease-in;
            border: 1px solid rgb(68, 68, 68);
          }
          .modal-input-section select::selection {
            outline: none;
            border: 1.5px solid black;
            background-color: white;
          }
    </style>
</head>
<body>
    <div class="create-investigator-section">
      
            <div class="form-container">
                <h2>Create Investigator</h2>
                <form method="post" id="create_investigator_form">
                    {% csrf_token %}
                    <div class="col-md-12">
                        <div class="d-flex row ">
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="first_name">First Name <span style="color: red;">*</span></label>
                                <input type="text" class="" id="first_name" name="first_name" required placeholder="First Name">
                            </div>
                            <!-- <div class="col-md-4 modal-input-section mb-3">
                                <label for="middle_name">Middle Name</label>
                                <input type="text" class="" id="middle_name" name="middle_name" placeholder="Middle Name">
                            </div> -->
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="last_name">Last Name</label>
                                <input type="text" class="" id="last_name" name="last_name" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="d-flex row ">
                            <div class="col-md-6 modal-input-section ">
                                <label for="email_id">Email <span style="color: red;">*</span></label>
                                <input type="email" class="" id="email_id" name="email_id" required  placeholder="example@gmail.com">
                            </div>
                            <div class="col-md-6 modal-input-section ">
                                <label for="mobile_number">Mobile Number <span style="color: red;">*</span></label>
                                <input type="tel" class="" id="mobile_number" name="mobile_number" pattern="[0-9]{10}" required maxlength="10" title="Please enter exactly 10 digits">
                                <p class="error-message" style="color: red;">{{ error_message }}</p>
                            </div>
                        </div>
                        <div class="d-flex row ">
                            <div class="col-md-12 modal-input-section mb-3">
                                <label for="address">Address <span style="color: red;">*</span></label>
                                <input type="text" class="" id="address" name="address" required  placeholder="Street, Locality, City, State">
                            </div>
                        </div>
                        <!-- <div class="d-flex row ">
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="district">District</label>
                                <input type="text" class="" id="district" name="district" required>
                            </div>
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="gender">Gender</label>
                                <input type="text" class="" id="gender" name="gender" required>
                            </div>
                        </div> -->

                        <div class="d-flex row">
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="district">District</label>
                                <input type="text" name="district" value="{{user.user_district}}" readonly>
                                <!-- select id="district" name="district"  required>
                                    <option value="" disabled selected>Select District</option>
                                    <option value="district1">District 1</option>
                                    <option value="district2">District 2</option>
                                    <option value="district3">District 3</option>
                                   
                                </select> -->
                            </div>
                            <div class="col-md-6 modal-input-section mb-3">
                                <label for="gender">Gender <span style="color: red;">*</span></label>
                                <select id="gender" name="gender"  required>
                                    <option value="" disabled selected>Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <!-- Add more genders as needed -->
                                </select>
                            </div>
                        </div>
                        
                        <div class="col-md-12 text-center">
                            <button type="submit" class="btn btn-success">Create Investigator</button>
                        </div>
                    </div>
                </form>
            </div>
      
    </div>

    <!-- <div class="col-md-12 text-center">
                            <button type="submit" class="btn btn-success" onclick="prepareAndSubmitForm()">Create Investigator</button>
                        </div> -->
<script>
    function prepareAndSubmitForm() {
        // Capitalize first letter of first_name input field
        var firstNameInput = document.getElementById('first_name');
        firstNameInput.value = firstNameInput.value.charAt(0).toUpperCase() + firstNameInput.value.slice(1);

        // Capitalize first letter of last_name input field
        var lastNameInput = document.getElementById('last_name');
        lastNameInput.value = lastNameInput.value.charAt(0).toUpperCase() + lastNameInput.value.slice(1);

        // Submit the form
        document.getElementById('create_investigator_form').submit();
    }
</script>
</body>
</html>

{% endblock %}
