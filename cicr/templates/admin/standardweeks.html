{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add District</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .add-district-form{
            width: 100%;
            min-height: calc(100vh - 118px);
            display: block;
            padding: 0;
        }

        .form-container {
            background: #ffffff;
            border: 1px solid #d9eadc;
            border-radius: 8px;
            padding: 28px 30px;
            max-width: none;
            width: 100%;
            min-height: calc(100vh - 142px);
            box-shadow: 0 18px 40px rgba(0, 93, 24, 0.08);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 6px;
            color: #17251d;
            font-weight: 800;
            text-align: left;
        }

        .form-subtitle {
            color: #66766d;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            max-width: 760px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: #10251a;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            min-height: 52px;
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #d9eadc;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #008000;
            box-shadow: 0 0 0 4px rgba(0, 128, 0, 0.08);
            outline: none;
        }

        .form-group p {
            font-size: 14px;
            color: red;
            margin-top: 5px;
        }

        button {
            background-color: #005d18;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 15px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.3s ease;
            min-width: 220px;
            width: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #007d22;
        }


        button:focus {
            outline: none;
        }
        .colored-toast.swal2-icon-success {
        background-color: #E9FFEA !important;
        }
        .toast-title{color: #198754;}
    </style>
</head>
<body>

        <div class="add-district-form">
            <div class="form-container">
                <h1>Add Standard Weeks</h1>
                <p class="form-subtitle">Create a new standard week for report mapping.</p>
                <form method="post" onsubmit="showToast()">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="standard_number">Standard Number:</label>
                        <input type="number" id="standard_number" name="standard_number" required placeholder="eg. 12">
                        <p>{{ number_message }}</p>
                    </div>

                    <div class="form-group">
                        <label for="standard_week">Standard Week:</label>
                        <input type="text" id="standard_week" name="standard_week" required oninput="updateMonthData()" placeholder="eg. JAN 01-07">
                        <p>{{ error_messages }}</p>
                    </div>

                    <div class="form-group">
                      <label for="weeks_value">Weeks:</label>
                      <select id="weeks_value" class="form-select" name="weeks_value" required>
                        <option value="Week 1">Week 1</option>
                        <option value="Week 2">Week 2</option>
                        <option value="Week 3">Week 3</option>
                        <option value="Week 4">Week 4</option>
                        <option value="Week 5">Week 5</option>
                      </select>
                    </div>

                    <div class="form-group">
                    	<label for="month_data">Month:</label>
                        <input type="text" id="month_data" name="month_data" required readonly>
                    </div>

                    <button type="submit">Save</button>
                </form>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const standardNameInput = document.getElementById('standard_week');
                standardNameInput.addEventListener('input', function() {
                    standardNameInput.value = standardNameInput.value.toUpperCase();
                });
            });
        </script>
        <script>
		    function updateMonthData() {
		        const standardWeek = document.getElementById('standard_week').value;
		        if (standardWeek.length >= 3) {
		            const monthAbbr = standardWeek.substring(0, 3).toUpperCase();
		            const monthNames = {
		                'JAN': 'January',
		                'FEB': 'February',
		                'MAR': 'March',
		                'APR': 'April',
		                'MAY': 'May',
		                'JUN': 'June',
		                'JUL': 'July',
		                'AUG': 'August',
		                'SEP': 'September',
		                'OCT': 'October',
		                'NOV': 'November',
		                'DEC': 'December'
		            };
		            const monthFullName = monthNames[monthAbbr] || '';
		            document.getElementById('month_data').value = monthFullName;
		        } else {
		            document.getElementById('month_data').value = '';
		        }
		    }
		</script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.11.0/dist/sweetalert2.all.min.js"></script>
		<script> 
		  function showToast(){
		    Swal.fire({
		      toast: true,
		      icon: 'success',
		      iconColor: '#198754',
		      customClass: {popup: 'colored-toast',title:'toast-title'},
		      title: 'Standard Week Added',
		      animation: false,
		      position: 'bottom',
		      showConfirmButton: false,
		      timer: 3000,
		      timerProgressBar: true,
		      didOpen: (toast) => {
		        toast.addEventListener('mouseenter', Swal.stopTimer)
		        toast.addEventListener('mouseleave', Swal.resumeTimer)
		      }
		    })
		  }
		</script>
</body>
</html>
{% endblock %}
