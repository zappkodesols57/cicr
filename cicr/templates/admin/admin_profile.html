{% extends 'admin_base.html' %}

{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="{% static 'assets1\images\logos\vr_main.png' %}"
      type="image/x-icon"
    />
    <link
      rel="shortcut icon"
      href="{% static 'assets1\images\logos\vr_main.png' %}"
      type="image/x-icon"
    />
    <title>Admin Profile</title>

  <style>

      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        overflow-x: hidden;
        font-family: "Poppines", sans-serif;
      }

      .user-profile-section {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        flex-wrap: wrap;
        background-color: #fff5f5;
      }

      .user-profile-section-child {
        width: 40rem;
        height: fit-content;
        box-shadow: 0px 10px 23px -3px rgba(0, 0, 0, 0.1);
        padding: 20px;
        margin: 50px;
        margin-left: 0;
        margin-right: 0;
        border-radius: 20px;
        background-color: white;
      }

      .user-profile-section-child-title {
        padding: 20px;
        padding-left: 0;
        padding-top: 0;
      }

      .user-profile-section-child-title span {
        font-size: 30px;
        font-weight: 600;
      }

      .user-profile-img-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: column;
        flex-wrap: nowrap;
        padding: 15px;
      }

      .user-profile-img {
        position: relative;
        width: 100px;
        height: 100px;
      }

      .user-profile-img img {
        width: 100%;
        height: 100%;
      }

      .change-profile-icon {
        position: absolute;
        bottom: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 5px;
        width: 35px;
        height: 35px;
        background-color: white;
        border-radius: 50%;

        transition: all 0.3s ease-out;
      }

      .user-profile-img:hover .change-profile-icon {
        background-color: black;
        color: white;
      }

      .name-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .sub-section {
        width: 50%;
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: column;
        flex-wrap: nowrap;
        padding-left: 5px;
        padding-right: 5px;
      }

      .sub-section label {
        width: 100%;

        padding-bottom: 10px;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 400;
      }

      .sub-section input {
        width: 100%;
        background-color: rgb(255, 240, 240);
        border: 1.1px solid rgba(0, 0, 0, 0);
        flex-grow: 1;
        border-radius: 6px;
        padding: 12px;
        font-size: 15px;
        transition: all 0.3s ease-out;
      }

      .dob-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .email-mobNo-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .sub-section input:focus {
        border: 1.1px solid rgb(179, 179, 179);
        outline: none;
        background-color: transparent;
      }

      .locality-city-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .state-pin-section {
        display: flex;
        justify-content: start;
        align-items: start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .save-btn button {
        width: 100%;

        margin-top: 15px;

        padding: 15px;
        padding-top: 10px;
        padding-bottom: 10px;
        font-size: 15px;
        background-color: black;
        border: none;
        border-radius: 10px;
        color: white;
        transition: all 0.3s ease-out;
      }

      .save-btn button:hover {
        background-color: rgb(42, 42, 42);
      }

      .save-btn-v2{
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .save-btn-v2 a{
        width: 100%;

        margin-top: 15px;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 15px;
        padding-top: 10px;
        padding-bottom: 10px;
        font-size: 15px;
        background-color: black;
        border: none;
        border-radius: 10px;
        color: white;
        transition: all 0.3s ease-out;
      }

      .save-btn-v2 a:hover{
        background-color: rgb(42, 42, 42);
      }

      @media screen and (max-width: 1000px) {
      }

      @media screen and (max-width: 768px) {
        .user-profile-section-child {
          width: 30rem;
        }
      }

      @media screen and (max-width: 450px) {

        .user-profile-section-child {
          width: 18rem;
        }

        .user-profile-section-child-title span {
          font-size: 20px;
        }

        .user-profile-img {
          position: relative;
          width: 80px;
          height: 80px;
        }

        .sub-section input {
          padding: 8px;
          font-size: 12px;
        }

        .sub-section label {
          font-size: 13px;
        }

        .save-btn button {
          font-size: 15px;
        }

        .save-btn-v2 a{
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body class="theme-color2 light ltr">


    <div class="user-profile-section">
      <div class="user-profile-section-child">
        <div class="user-profile-section-child-title">
          <span>Manage Profile</span>
        </div>
        <form
          enctype="multipart/form-data"
          action="{% url 'admin_profile' %}"
          method="post"
        >
        {% csrf_token %}
          <div class="name-section">
            <div class="sub-section">
              <label>First Name</label>
              <input
                type="text"
                name="first_name"
                value="{{data.first_name}}"
                id="first_name"
                oninput="this.value = this.value.replace(/[^a-z A-Z]/g, '')"
                
              />
            </div>

            <div class="sub-section">
              <label>Last Name</label>
              <input
                type="text"
                name="last_name"
                value="{{data.last_name}}"
                id="last_name"
                oninput="this.value = this.value.replace(/[^a-z A-Z]/g, '')"
                
              />
            </div>
          </div>

          <div class="email-mobNo-section">
            <div class="sub-section">
              <label>Email ID</label>
              <input
                type="email"
                name="email_id"
                value="{{data.email_id}}"
                id="email_id"
              />
            </div>

            <div class="sub-section">
              <label>Mobile</label>
              <input
                type="tel"
                name="mobile_number"
                value="{{data.mobile_number}}"
                id="mobile_number"
                pattern="[0-9]{10}" 
                maxlength="10"
                title="Please enter 10 digits Mobile Number" />
            </div>
          </div>

          <div class="locality-city-section">
            <div class="sub-section">
              <label>Address</label>
              <input
                type="text"
                name="address"
                id="address"
                value="{{data.address}}"
                oninput="this.value = this.value.replace(/[^a-z A-Z 0-9]/g, '')"
                placeholder="Enter Address"
              />
            </div>
            <div class="sub-section">
              <label>District</label>
              <input
                type="text"
                name="user_district"
                value="{{data.user_district}}"
                id="user_district"
                readonly
              />
            </div>
            
          </div>




          <!-- <input type="submit" class="btn btn-primary submit-btn">Save Changes</button> -->




          <div class="save-btn">
            <button type="submit" value="Save" id="saveButton">
              Update Information
            </button>
            <!-- <input type="submit" value="Save" id="saveButton" /> -->
          </div>


        </form>
      </div>
    </div>

  </body>
</html>

{% endblock content %}
