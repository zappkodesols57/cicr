{% extends "base.html" %} 
{% block content %}


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="border-bottom w-100 text-center">
	<h1 class="ms-3 fw-bold" style="font-size: 25px;">Advisories</h1>
</div>
<div class="d-flex justify-content-between align-items-center">
	<div class="p-2">
		<a class="btn btn-success" href="{% url 'advisory_create' %}">Create New Advisory</a>
	</div>

	<div class="filter-container d-flex align-items-center me-2">
	    <select id="monthFilter" class="form-select form-select-sm">
	        <option value="">Select Month</option>
	    </select>
	    <button class="btn btn-secondary btn-sm ms-2" onclick="resetFilter()">Reset</button>
	</div>
</div>

<div class="p-2 mt-2">
	<table class="table table-bordered table-responsive text-center" id="advisoryTable">
		<thead class="table-secondary">
			<td>Sr. No.</td>
			<td>Week No.</td>
			<td>Title</td>
			<td>Month</td>
			<td>Action</td>
		</thead>
		<tbody>
			{% for advisory in advisories %}
			<tr>
				<td>{{ forloop.counter }}</td>
				<td>{{ advisory.week_en }} ({{ advisory.week_hi }})</td>
				<td>{{ advisory.date_range_en }}</td>
				<td class="month-column">{{ advisory.month_en }}</td>
				<td>
					<a class="bi bi-pencil-square text-success" href="{% url 'advisory_update' advisory.id %}"></a>
					<a class="bi bi-trash text-danger" href="{% url 'advisory_delete' advisory.id %}"></a>
				</td>
			</tr>
			 {% endfor %}
		</tbody>
	</table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const table = document.getElementById('advisoryTable');
        const rows = table.getElementsByTagName('tr');
        const monthFilter = document.getElementById('monthFilter');
        const uniqueMonths = new Set();

        for (let i = 1; i < rows.length; i++) {
            const month = rows[i].getElementsByClassName('month-column')[0].textContent;
            uniqueMonths.add(month.trim());
        }
        uniqueMonths.forEach(month => {
            const option = document.createElement('option');
            option.value = month;
            option.textContent = month;
            monthFilter.appendChild(option);
        });
        monthFilter.addEventListener('change', function() {
            filterByMonth();
        });
    });

    function filterByMonth() {
        const selectedMonth = document.getElementById('monthFilter').value.toLowerCase();
        const table = document.getElementById('advisoryTable');
        const rows = table.getElementsByTagName('tr');

        for (let i = 1; i < rows.length; i++) { // Start from 1 to skip the header row
            const month = rows[i].getElementsByClassName('month-column')[0].textContent.toLowerCase();
            if (selectedMonth === '' || month === selectedMonth) {
                rows[i].style.display = '';
            } else {
                rows[i].style.display = 'none';
            }
        }
    }

    function resetFilter() {
        document.getElementById('monthFilter').value = '';
        filterByMonth();
    }
</script>
{% endblock %}
