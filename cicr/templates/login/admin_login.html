<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }
        .login-container label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            text-align: left;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input::focus{
        	border: 1px solid #4CAF50;
        }
        .login-container input[type="submit"] {
            background-color: #4caf50;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .login-container input[type="submit"]:hover {
            background-color: #45a049;
        }
        .header{
        	display: flex;
        	flex-wrap: wrap;
        	justify-content: space-around;
        	align-items: center;
        	padding: 20px;
        	margin: 10px 0px;
        }
        h3{
        	font-size: 25px;
    		font-weight: 600;
    		margin: 10px;
    		text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 35px;
        }
        h2{
        	font-size: 30px;
        }
        .form-bx{
        	width: 400px;
        	background-color: #ffffff;
        	border: 1px solid #efefef;
        	border-radius: 10px;
        	padding: 25px;
        	margin-top: 20px;
    		box-shadow: 3px 3px 20px rgba(0,0,0,0.1);
        }
        .container{
        	display: flex;
		    justify-content: center;
		    align-items: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="header">
    	<img src="/media/Logo/cicrlogo.png" width="120">
    	<div class="text-center">
    		<h1>ICAR - Central Institute for Cotton Research</h1>
    		<div>Ministry of Agriculture and Farmer Welfare</div>
    		<div>Government of India</div>
    	</div>
    <div style="width: 130px;"></div>
    </div>
    <div class="text-center">
    	<h2>Insect Resistance Management (IRM)</h2>
    </div>
    <div class="container">
    	<div class="form-bx">
		    <form method="post">
		    	<h3 class="text-success">Super Admin Login</h3>
		        {% csrf_token %}
		        <div>
		            <label for="user_id">Username</label>
		            <input type="text" id="user_id" name="user_id" required>
		        </div>
		        <div>
		            <label for="password">Password</label>
		            <input type="password" id="password" name="password" required>
		        </div>
                <p id="error-message" style="color: red;">{{ error_message }}</p>
		        <input type="submit" class="btn btn-success w-100" value="Login">
		    </form>
		    <div class="pt-2">
		    	<a href="/login/" class="text-success">Admin Login</a>
		    </div>
	    </div>
    </div>
</div>

</body>
</html>
