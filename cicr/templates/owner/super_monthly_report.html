{% extends "base.html" %} 
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Months</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"/>
    <style>
        .table-container {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        td {
            background-color: #f9f9f9;
        }
        .btn-primary {
            color: #fff;
            background-color: #28a745;
            border-color: #28a745;
        }
        .header-text {
            color: #28a745;
            margin-bottom: 20px;
        }
        .search-bar {
            margin-bottom: 20px;
        }
        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .pagination button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        .pagination button.disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="table-container">
        <h2 class="text-center">{{district_name}} MONTHS LIST</h2>
       
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th style="width: 10%;">Sr. No.</th>
                    <th style="width: 70%;">Months</th>
                    <th style="width: 20%;">Action</th>
                </tr>
            </thead>
            <tbody id="monthsTable">
                {% for i in unique_months %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i }}</td>
                    <td>
                        <div>
                            <a type="button" data-toggle="tooltip" data-original-title="View" href="/super_monthly_progress/{{district_name}}/{{ i }}/" >
                                <i class="uil uil-eye" style="color: #000000; font-size:16px"></i>
                            </a>
                        </div>
                    </td> 

                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">
                        <div class="text-center">Months Not Available</div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div class="pagination" id="pagination">
            <button id="prev-page" class="disabled">Previous</button>
            <button id="next-page">Next</button>
        </div>

        <!-- <div class="text-center" style="margin-top: 20px;">
            <p>Total Number of Months: {{ unique_months|length }}</p>
        </div> -->
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    const rowsPerPage = 10;
    let currentPage = 1;
    const table = document.getElementById('monthsTable');
    const rows = table.getElementsByTagName('tr');
    const totalRows = rows.length;
    const totalPages = Math.ceil(totalRows / rowsPerPage);
    const pagination = document.getElementById('pagination');

    function updateTable() {
        for (let i = 0; i < totalRows; i++) {
            rows[i].style.display = (i >= (currentPage - 1) * rowsPerPage && i < currentPage * rowsPerPage) ? '' : 'none';
        }

        document.getElementById('prev-page').classList.toggle('disabled', currentPage === 1);
        document.getElementById('next-page').classList.toggle('disabled', currentPage === totalPages);
    }

    document.getElementById('prev-page').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            updateTable();
        }
    });

    document.getElementById('next-page').addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            updateTable();
        }
    });

    if (totalRows <= rowsPerPage) {
        pagination.style.display = 'none';
    } else {
        pagination.style.display = 'flex';
    }

    updateTable();
</script>
</body>
</html>

{% endblock content %}
