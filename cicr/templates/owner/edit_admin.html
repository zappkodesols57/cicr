{% extends "base.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add District</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
        }

        .add-district-form{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: #ffffff;
            border-radius: 8px;
            
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: black;
            outline: none;
        }

        .form-group p {
            font-size: 14px;
            color: red;
            margin-top: 5px;
        }

        button {
            background-color: #198754;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            display: block;
        }


        button:focus {
            outline: none;
        }
    </style>
</head>
<body>

        <div class="add-district-form">
            <div class="form-container">
                <h1>Edit Admin Details</h1>
                <form method="post">
                    {% csrf_token %}
                      <div class="form-group">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" value="{{data.first_name}}">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" value="{{data.last_name}}">
                    </div>

                    <div class="form-group">
                        <label for="email_id">First Name:</label>
                        <input type="text" id="email_id" name="email_id" value="{{data.email_id}}">
                    </div>
                    <button type="submit">Save</button>
                </form>
            </div>
        </div>
       <!--  <script>
            document.addEventListener('DOMContentLoaded', function() {
                const districtNameInput = document.getElementById('district_name');
                districtNameInput.addEventListener('input', function() {
                    districtNameInput.value = districtNameInput.value.toUpperCase();
                });
            });
        </script> -->
</body>
</html>
{% endblock %}
