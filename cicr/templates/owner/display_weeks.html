{% extends "base.html" %} {% block content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Districts List</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <style>
      .container {
        max-width: 1280px;
        padding: 0;
      }
      .table-container {
        margin-top: 0;
        padding: 28px;
        background-color: #ffffff;
        border: 1px solid #d9eadc;
        border-radius: 8px;
        box-shadow: 0 18px 40px rgba(0, 93, 24, 0.08);
      }
      .table-container h2 {
        color: #005d18;
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 22px;
      }
      .table th,
      .table td {
        vertical-align: middle;
        padding: 14px 16px;
        font-size: 17px;
      }
      .table {
        width: 100% !important;
        max-width: 760px;
        margin: 0 auto;
      }
      .btn-primary {
        background-color: #198754;
        border-color: #198754;
      }
      .btn-primary:hover {
        background-color: #157347;
        border-color: #157347;
      }
      .tooltip-inner {
        background-color: #198754;
        color: #ffffff;
      }
      .tooltip-arrow::before {
        border-top-color: #198754;
      }

      .create i {
        font-size: 20px;
        color: #198754;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="table-container">
        <h2 class="text-center">Standard Weeks List</h2>
        <table class="table table-hover table-bordered w-50 text-center">
          <thead class="">
            <tr>
              <!-- <th scope="col" style="width: 10%; text-align: center">
                Sr. No.
              </th> -->
              <th scope="col">Standard Number</th>
              <th scope="col">Standard Weeks</th>
              <!-- <th scope="col" style="width: 20%; text-align: center">
                Actions
              </th> -->
            </tr>
          </thead>
          <tbody>
            {% for i in week %}
            <tr>
              <!-- <td style="text-align: center">{{ forloop.counter }}</td> -->
              <td>{{ i.standard_number }}</td>
              <td>{{ i.standard_week }}</td>
              <!-- <td style="text-align: center">
                <a
                  type="button"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Create & Edit"
                  href="/users/{{ i.district_name }}/"
                  class="create"
                >
                  <i class="bx bx-plus-circle"></i>
                </a>
              </td> -->
            </tr>
            {% endfor %}
          </tbody>
        </table>
        <div class="text-center mt-4">
          <p>Total Number of Weeks: <strong>{{ week|length }}</strong></p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      var tooltipTriggerList = [].slice.call(
        document.querySelectorAll('[data-bs-toggle="tooltip"]')
      );
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    </script>
  </body>
</html>
{% endblock content %}
