{% extends "base.html" %} {% block content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Districts List</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #ffffff;
      }
      .table-container {
        margin-top: 50px;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 8px;
      }
      .table th,
      .table td {
        vertical-align: middle;
      }
      .btn-primary {
        background-color: #198754;
        border-color: #198754;
      }
      .btn-primary:hover {
        background-color: #157347;
        border-color: #157347;
      }
      .tooltip-inner {
        background-color: #198754;
        color: #ffffff;
      }
      .tooltip-arrow::before {
        border-top-color: #198754;
      }

      .create i {
        font-size: 20px;
        color: #198754;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="table-container">
        <h2 class="text-center">Admin Districts List</h2>
        <table class="table table-hover table-bordered">
          <thead class="">
            <tr>
              <th scope="col" style="width: 10%; text-align: center">
                Sr. No.
              </th>
              <th scope="col" style="width: 70%">District</th>
              <th scope="col" style="width: 20%; text-align: center">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            {% for i in dis %}
            <tr>
              <td style="text-align: center">{{ forloop.counter }}</td>
              <td>{{ i.district_name }}</td>
              <td style="text-align: center">
                <a
                  type="button"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Create & Edit"
                  href="/users/{{ i.district_name }}/"
                  class="create"
                >
                  <i class="bx bx-plus-circle"></i>
                </a>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
        <div class="text-center mt-4">
          <p>Total Number of Districts: <strong>{{ dis|length }}</strong></p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      var tooltipTriggerList = [].slice.call(
        document.querySelectorAll('[data-bs-toggle="tooltip"]')
      );
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    </script>
  </body>
</html>
{% endblock content %}
