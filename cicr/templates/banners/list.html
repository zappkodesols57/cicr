{% extends "base.html" %} 
{% block content %}

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Manage Banners</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Banner List</h2>

    <!-- Add Banner Button -->
    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#bannerModal" onclick="openAddModal()">
        Add Banner
    </button>

    <!-- Banner Table -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for banner in banners %}
            <tr>
                <td><img src="{{ banner.image.url }}" width="150"></td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="openEditModal({{ banner.id }}, '{{ banner.image.url }}')">Edit</button>
                    <a href="{% url 'banner_delete' banner.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="bannerModal" tabindex="-1" aria-labelledby="bannerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form method="POST" enctype="multipart/form-data" class="modal-content">
        {% csrf_token %}
        <input type="hidden" name="banner_id" id="bannerIdField">
        <div class="modal-header">
            <h5 class="modal-title" id="bannerModalLabel">Add/Edit Banner</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label for="image" class="form-label">Select Image</label>
                <input type="file" class="form-control" name="image" id="image" required>
            </div>
            <div class="mb-3" id="currentImageDiv" style="display: none;">
                <p>Current Image:</p>
                <img id="currentImagePreview" src="" width="150">
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
    </form>
  </div>
</div>

<script>
function openAddModal() {
    document.getElementById('bannerModalLabel').innerText = 'Add Banner';
    document.getElementById('bannerIdField').value = '';
    document.getElementById('image').required = true;
    document.getElementById('currentImageDiv').style.display = 'none';
}

function openEditModal(id, imageUrl) {
    document.getElementById('bannerModalLabel').innerText = 'Edit Banner';
    document.getElementById('bannerIdField').value = id;
    document.getElementById('currentImagePreview').src = imageUrl;
    document.getElementById('currentImageDiv').style.display = 'block';
    document.getElementById('image').required = true;
    const modal = new bootstrap.Modal(document.getElementById('bannerModal'));
    modal.show();
}
</script>
</body>
</html>

{% endblock %}
